# /etc/modprobe.d/v4l2loopback.conf
# Configure v4l2loopback for Intel IPU7 on-demand camera forwarding.
# exclusive_caps=1 ensures Chrome, WebRTC and QtMultimedia recognize /dev/video50
# as a valid capture device only when an active stream is connected.
options v4l2loopback exclusive_caps=1 card_label="Integrated Camera" video_nr=50
