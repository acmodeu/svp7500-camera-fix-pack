PACKAGE_NAME="intel-ipu7-psys"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="intel-ipu7-psys"
BUILT_MODULE_LOCATION[0]="drivers/media/pci/intel/ipu7/psys"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"

if [ -f "/lib/modules/${kernelver}/build/.config" ] &&
   grep -q '^CONFIG_CC_IS_CLANG=y' "/lib/modules/${kernelver}/build/.config" 2>/dev/null; then
  _CC_FLAGS="CC=clang LD=ld.lld LLVM=1"
else
  _CC_FLAGS=""
fi

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ${_CC_FLAGS} modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build ${_CC_FLAGS} clean"
